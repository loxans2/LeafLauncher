<!doctype html>
<html lang="fr" data-accent="leaf">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bgImage"></div><div id="bgDim"></div>
  <canvas id="bg"></canvas>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="grain"></div>

  <div id="splash">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 100 100">
        <path class="fill" d="M22 78 C 18 46, 40 20, 80 18 C 82 58, 58 82, 22 78 Z"/>
        <path d="M22 78 C 18 46, 40 20, 80 18 C 82 58, 58 82, 22 78 Z"/>
        <path class="vein" d="M22 78 C 40 60, 56 44, 72 28"/>
      </svg>
      <div class="splash-wordmark"><img src="logo.png" alt="LeafLauncher"><i class="splash-shine"></i></div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <div class="app">
    <header class="titlebar">
      <div class="brand"><img src="icon.png" alt=""><img class="brand-logo" src="logo.png" alt="LeafLauncher"></div>
      <div class="drag" data-tauri-drag-region></div>
      <div class="task-pill" id="taskPill"><div class="ring"></div><span id="taskText">Préparation…</span><div class="mini"><i id="taskBar"></i></div></div>
      <div class="drag" data-tauri-drag-region style="flex:.15"></div>
      <div class="win-btns">
        <button id="wMin" title="Réduire"><svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="wMax" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="wClose" class="close" title="Fermer"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav" id="nav">
        <div class="nav-indicator" id="navIndicator"></div>
        <button data-page="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
        <button data-page="instances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>Instances</button>
        <button data-page="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M17 14v6M14 17h6"/></svg>Mods</button>
        <button data-page="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>Nouveau</button>
        <button data-page="console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>Console</button>
        <button data-page="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>Thème</button>
        <button data-page="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Comptes</button>
        <button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
      </nav>
      <div class="spacer"></div>
      <button class="account-btn" id="accountBtn" title="Compte"></button>
    </aside>

    <main class="view" id="view">
      <section class="page active" id="page-home"></section>
      <section class="page" id="page-instances"></section>
      <section class="page" id="page-library"></section>
      <section class="page" id="page-news"></section>
      <section class="page" id="page-theme"></section>
      <section class="page" id="page-console"></section>
      <section class="page" id="page-accounts"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
